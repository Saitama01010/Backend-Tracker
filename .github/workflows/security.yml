name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-and-secret-scan:
    name: Dependencies and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 10.23.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Verify lockfile install
        run: pnpm install --frozen-lockfile --lockfile-only --ignore-scripts

      - name: Audit npm dependencies
        run: pnpm run audit:dependencies

      - name: Install verified OSV-Scanner 2.5.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/google/osv-scanner/releases/download/v2.5.0/osv-scanner_linux_amd64 \
            --output "$RUNNER_TEMP/osv-scanner"
          expected="edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c"
          actual="$(sha256sum "$RUNNER_TEMP/osv-scanner" | awk '{ print $1 }')"
          test "$actual" = "$expected"
          chmod 0755 "$RUNNER_TEMP/osv-scanner"

      - name: Scan lockfile with OSV
        shell: bash
        run: |
          set +e
          "$RUNNER_TEMP/osv-scanner" scan source \
            --lockfile=pnpm-lock.yaml \
            --config=osv-scanner.toml \
            --format=json \
            --output-file="$RUNNER_TEMP/osv-results.json" \
            --verbosity=error \
            > "$RUNNER_TEMP/osv.log" 2>&1
          scan_exit=$?
          set -e
          if [ "$scan_exit" -ne 0 ]; then
            echo "OSV scan failed. Review a local JSON report; CI intentionally does not publish finding details."
            exit 1
          fi
          echo "OSV scan passed."

      - name: Install verified Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          expected="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          actual="$(sha256sum "$RUNNER_TEMP/gitleaks.tar.gz" | awk '{ print $1 }')"
          test "$actual" = "$expected"
          tar --extract --gzip --file="$RUNNER_TEMP/gitleaks.tar.gz" --directory="$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"

      - name: Scan new commits for secrets
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set +e
          common_args=(
            --redact=100
            --no-banner
            --no-color
            --log-level=error
            --report-format=json
            --report-path="$RUNNER_TEMP/gitleaks-report.json"
          )

          if [ "$EVENT_NAME" = "pull_request" ]; then
            "$RUNNER_TEMP/gitleaks" git "${common_args[@]}" \
              --log-opts="$PR_BASE_SHA..$PR_HEAD_SHA" . \
              > "$RUNNER_TEMP/gitleaks.log" 2>&1
          elif [ "$EVENT_NAME" = "push" ] && ! printf '%s' "$PUSH_BEFORE_SHA" | grep --quiet --extended-regexp '^0+$'; then
            "$RUNNER_TEMP/gitleaks" git "${common_args[@]}" \
              --log-opts="$PUSH_BEFORE_SHA..$CURRENT_SHA" . \
              > "$RUNNER_TEMP/gitleaks.log" 2>&1
          else
            "$RUNNER_TEMP/gitleaks" dir "${common_args[@]}" . \
              > "$RUNNER_TEMP/gitleaks.log" 2>&1
          fi
          scan_exit=$?
          set -e

          if [ "$scan_exit" -ne 0 ]; then
            echo "Gitleaks detected a potential secret. Reproduce locally with redaction; CI intentionally does not publish finding details."
            exit 1
          fi
          echo "Gitleaks scan passed."

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyze JavaScript and TypeScript
        uses: github/codeql-action/analyze@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        with:
          category: /language:javascript-typescript
