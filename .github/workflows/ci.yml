name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:54329/backend_tracker_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 10.23.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Verify security CI policy
        run: pnpm run test:security-ci

      - name: Run unit tests
        run: pnpm run test

      - name: Run baseline regression tests
        run: pnpm run test:baseline

      - name: Run security regression tests
        run: pnpm run test:security

      - name: Run frontend performance tests
        run: pnpm run test:frontend-performance

      - name: Run database performance tests
        run: pnpm run test:performance

      - name: Run data-correctness tests
        run: pnpm run test:data-correctness

      - name: Run guarded live smoke tests
        run: pnpm run test:smoke

      - name: Build production bundles
        run: pnpm run build

      - name: Enforce frontend bundle budget
        run: pnpm run check:frontend-bundle
